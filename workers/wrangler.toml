name = "galloli-sync"
main = "index.js"
compatibility_date = "2024-01-22"

# Variables de entorno
[vars]
ENVIRONMENT = "production"

# ── Licencias / activación (ver docs/LICENCIAS.md) ────────────────────────────
# LICENSE_PUBLIC_KEY: clave pública del vendedor (base64url SPKI, curva P-256).
#   Se genera con:  node sale/tools/licencias.js --init
#   La clave PRIVADA se queda en tu computadora y es la única que puede emitir códigos.
# LICENSE_ENFORCED: "1" exige licencia para sincronizar; "0" lo desactiva.
#   Si LICENSE_PUBLIC_KEY está vacía, el servidor queda abierto (no exige licencia)
#   aunque LICENSE_ENFORCED sea "1".
LICENSE_PUBLIC_KEY = ""
LICENSE_ENFORCED = "0"

# Base de datos D1
[[d1_databases]]
binding = "DB"
database_name = "galloli"
database_id = "c5dd06b9-2998-49d5-834e-fd0d5f7f8da1"

# Durable Objects
[[durable_objects.bindings]]
name = "SESSION_MANAGER"
class_name = "SessionManager"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionManager"]

# Cron Triggers (hora Ecuador = UTC-5)
# 10 PM Ecuador = 03:00 UTC → backup + push noche
# 8 AM Ecuador  = 13:00 UTC → push créditos mañana
# 12 PM Ecuador = 17:00 UTC → push merma mediodía
# 6 PM Ecuador  = 23:00 UTC → push merma tarde
[triggers]
crons = ["0 3 * * *", "0 13 * * *", "0 17 * * *", "0 23 * * *"]