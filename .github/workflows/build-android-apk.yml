name: Build GallOli APK Nativo (apk-native branch)

on:
  push:
    branches: [apk-native]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install TypeScript
        run: npm install -D typescript --legacy-peer-deps

      - name: Install Capacitor plugins (APK nativo)
        run: |
          npm install @capacitor-community/bluetooth-le --legacy-peer-deps
          npm install @capacitor/geolocation --legacy-peer-deps
          npm install @capacitor/local-notifications --legacy-peer-deps
          npm install @capacitor/push-notifications --legacy-peer-deps
          npm install @capacitor/app --legacy-peer-deps
          npm install @capacitor/preferences --legacy-peer-deps
          npm install @capacitor-firebase/messaging --legacy-peer-deps

      - name: Bundle BleClient for vanilla JS
        run: |
          npm install -D esbuild --legacy-peer-deps
          npx esbuild js/ble-entry.js \
            --bundle \
            --format=iife \
            --global-name=__BleBundle \
            --outfile=js/ble-bundle.js \
            --platform=browser \
            --target=es2017
          echo "ble-bundle.js generado"

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/
          cp -r css www/
          cp -r js www/
          cp -r icons www/
          cp -r src www/ 2>/dev/null || true
          cp manifest.json www/
          cp sw.js www/
          cp _headers www/ 2>/dev/null || true
          cp -r .well-known www/ 2>/dev/null || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # El runner ubuntu-latest ya incluye el SDK de Android con cmdline-tools.
      # No se usa android-actions/setup-android porque fallaba de forma silenciosa y dejaba
      # el build sin sdkmanager (ver commits del 2026-10-06).
      - name: Setup Android SDK (preinstalado del runner)
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          CMDLINE="$SDK/cmdline-tools/latest/bin"
          if [ ! -x "$CMDLINE/sdkmanager" ]; then
            ENCONTRADO="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | sort | tail -1 || true)"
            if [ -n "$ENCONTRADO" ]; then
              CMDLINE="$(dirname "$ENCONTRADO")"
            fi
          fi

          if [ ! -x "$CMDLINE/sdkmanager" ]; then
            echo "sdkmanager no encontrado; instalando commandlinetools desde dl.google.com"
            curl -sS -L -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
            CMDLINE="$SDK/cmdline-tools/latest/bin"
          fi

          echo "$CMDLINE" >> "$GITHUB_PATH"
          export PATH="$CMDLINE:$PATH"
          sdkmanager --version

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK components
        run: sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Add Android platform
        run: npx cap add android || echo "Platform already exists"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Copy app icons from TWA (same icons as Play Store version)
        run: |
          RES="android/app/src/main/res"
          ICONS=".github/apk-icons"

          # Copiar iconos de cada densidad directamente desde los iconos de la TWA
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            cp "$ICONS/mipmap-$d/ic_launcher.png"            "$RES/mipmap-$d/ic_launcher.png"
            cp "$ICONS/mipmap-$d/ic_launcher_round.png"      "$RES/mipmap-$d/ic_launcher_round.png"
            cp "$ICONS/mipmap-$d/ic_launcher_foreground.png" "$RES/mipmap-$d/ic_launcher_foreground.png"
          done

          # Copiar XMLs adaptativos
          mkdir -p "$RES/mipmap-anydpi-v26"
          cp "$ICONS/mipmap-anydpi-v26/ic_launcher.xml"       "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          cp "$ICONS/mipmap-anydpi-v26/ic_launcher_round.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          # Copiar icono de notificacion
          mkdir -p "$RES/drawable"
          cp "$ICONS/drawable/ic_notification.png" "$RES/drawable/ic_notification.png"

          # Configurar color de fondo del icono adaptativo
          rm -f "$RES/values/ic_launcher_background.xml"
          mkdir -p "$RES/values"
          if grep -q "ic_launcher_background" "$RES/values/colors.xml" 2>/dev/null; then
            sed -i 's|<color name="ic_launcher_background">.*</color>|<color name="ic_launcher_background">#ffffff</color>|' "$RES/values/colors.xml"
          else
            sed -i 's|</resources>|    <color name="ic_launcher_background">#ffffff</color>\n</resources>|' "$RES/values/colors.xml" 2>/dev/null || \
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#ffffff</color>\n</resources>\n' > "$RES/values/colors.xml"
          fi

          echo "=== Iconos copiados desde TWA ==="
          ls -la "$RES/mipmap-hdpi/"

      - name: Disable Capacitor splash screen
        run: |
          python3 .github/scripts/disable_splash.py
          sed -i 's|AppTheme\.NoActionBarLaunch|AppTheme.NoActionBar|g' android/app/src/main/AndroidManifest.xml

      - name: Generate splash screens
        run: |
          SRC="icons/favicon.pub/android-chrome-512x512.png"
          RES="android/app/src/main/res"
          for cfg in "port-mdpi:320x480" "port-hdpi:480x800" "port-xhdpi:720x1280" "port-xxhdpi:960x1600" "port-xxxhdpi:1280x1920"; do
            d="${cfg%%:*}"; dims="${cfg##*:}"; w="${dims%%x*}"; h="${dims##*x}"; s=$((w * 40 / 100))
            mkdir -p "$RES/drawable-$d"
            convert -size ${w}x${h} xc:"#185a83" \( "$SRC" -resize ${s}x${s} \) -gravity center -composite "$RES/drawable-$d/splash.png"
          done

      - name: Copy native Java/Kotlin files
        run: |
          JAVA_DIR="android/app/src/main/java/store/ivapps/galloli"
          mkdir -p "$JAVA_DIR"
          cp .github/android-src/BleForegroundPlugin.java   "$JAVA_DIR/"
          cp .github/android-src/BleForegroundService.java  "$JAVA_DIR/"
          cp .github/android-src/MainActivityFcm.java       "$JAVA_DIR/MainActivity.java"
          cp .github/android-src/GalloliFirebaseService.java "$JAVA_DIR/"
          # Archivos Kotlin del parche APK nativo
          cp .github/android-src/GeofenceBleService.kt      "$JAVA_DIR/"
          cp .github/android-src/BootReceiver.kt            "$JAVA_DIR/"
          ls -la "$JAVA_DIR"

      - name: Setup Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python .github/scripts/patch_firebase.py

      - name: Patch AndroidManifest
        run: |
          python3 - <<'PYEOF'
          import re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()

          permissions = """
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />"""

          content = re.sub(r'(<manifest[^>]*>)', r'\1' + permissions, content, count=1)

          services = """
              <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="galloli_push_channel_v2" />
              <service android:name=".BleForegroundService" android:enabled="true" android:exported="false" android:foregroundServiceType="connectedDevice|location" />
              <service android:name=".GeofenceBleService" android:enabled="true" android:exported="false" android:foregroundServiceType="location|connectedDevice" />
              <service android:name=".GalloliFirebaseService" android:exported="false">
                  <intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT" /></intent-filter>
              </service>
              <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                  </intent-filter>
              </receiver>
          """

          content = content.replace("</application>", services + "\n    </application>")

          with open(manifest_path, "w") as f:
              f.write(content)

          print("AndroidManifest parcheado para APK nativo")
          PYEOF

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Add play-services-location dependency
        run: |
          # FusedLocationProviderClient requiere play-services-location
          GRADLE="android/app/build.gradle"
          if ! grep -q "play-services-location" "$GRADLE"; then
            sed -i "s|dependencies {|dependencies {\n    implementation 'com.google.android.gms:play-services-location:21.3.0'|" "$GRADLE"
            echo "play-services-location agregado a build.gradle"
          else
            echo "play-services-location ya existe en build.gradle"
          fi

      - name: Decode and install Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          echo "$RELEASE_KEYSTORE" | base64 --decode > android/app/galloli-release.keystore
          echo "Keystore instalado en android/app/galloli-release.keystore"

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/galloli-release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --stacktrace

      - name: Rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK_PATH" android/app/build/outputs/apk/release/GallOli-Native.apk
          echo "APK renombrado: GallOli-Native.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GallOli-Native-APK
          path: android/app/build/outputs/apk/release/GallOli-Native.apk
          retention-days: 30

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Telethon
        run: pip install telethon

      - name: Get app version
        id: version
        run: echo "APP_VERSION=$(grep -o 'APP_VERSION.*=.*' sw.js | head -1 | grep -o \"'[^']*'\" | head -1 | tr -d \"'\")" >> $GITHUB_OUTPUT

      # El APK ya quedo subido como artifact: si Telegram falla, el build no debe marcarse rojo
      - name: Send APK to Telegram
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
        run: python .github/scripts/send_native_apk.py
